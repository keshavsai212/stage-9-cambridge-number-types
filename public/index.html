<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 9 Cambridge IGCSE Number Types</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero" aria-labelledby="title">
        <div class="hero-copy">
          <p class="eyebrow">Cambridge IGCSE Stage 9 Maths</p>
          <h1 id="title">Different Types of Numbers</h1>
          <p>
            A focused learning space for classifying natural numbers, fractions,
            rational numbers, irrational numbers, surds, primes, factors, and more.
          </p>
        </div>

        <div class="quick-map" aria-label="Number family map">
          <span>Natural</span>
          <span>Whole</span>
          <span>Integer</span>
          <span>Rational</span>
          <span>Real</span>
        </div>
      </section>

      <section class="micro-prompt">
        <div>
          <h2>Micro Prompt</h2>
          <p id="microPrompt">Loading prompt...</p>
        </div>
      </section>

      <section class="lesson">
        <aside class="tab-list" id="tabs" aria-label="Lesson tabs"></aside>
        <article class="content" id="content" aria-live="polite"></article>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
